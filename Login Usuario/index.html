<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario</title>
    <link rel="icon" href="../imagenes/perfil.png">
    <link rel="stylesheet" href="styles/styles.css">

</head>
<body>
    <div id="container">
    <img id="logo_perfil"title="Perfil" src="../imagenes/perfil.png" alt="Perfil">
    <h1>MATE VERSE</h1>

    <form action="#" method="post">
        <input type="text" name="nombre" placeholder="Nombre completo" required>
        <input type="text" name="usuario" placeholder="Nombre Usuario" required>
        <input type="email" name="email" placeholder="Correo electrónico" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <input type="password" name="confirmar" placeholder="Confirmar contraseña" required>
        <button type="submit">Registrarse</button>
    </form>

    <div class="link">
        ¿Ya tienes cuenta? <a href="../Iniciar Sesion/index.html">Inicia sesión</a>
    </div>
    </div>
    
</body>
</html>
