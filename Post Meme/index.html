<!DOCTYPE html>
<html lang="en">
<head>
    <title>Subir memes</title>
    <link rel="icon" href="imagenes/icono.ico">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
<div id="container">
    <img id="logo_pag" title="MateVerse" src="imagenes/icono.ico" alt="Logo MateVerse">
    <h2>PUBLICAR MEMES</h2>
    <form action="#" method="post">
        <input type="text" name="titulo" placeholder="Titulo" required>
        <input type="text" name="imagen" placeholder="Link de imagen/video" required>
        <input type="text" name="descripcion" placeholder="Descripcion" required>
        <input type="text" name="protagonista" placeholder="Protagonista" required>
        <button type="submit">Registrar</button>
    </form>

</div>
</body>
</html>
