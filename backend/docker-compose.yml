services:
  db:
    image: postgres:16
    container_name: database
    environment:
      - POSTGRES_USER=Devs4
      - POSTGRES_PASSWORD=mate
      - POSTGRES_DB=mateverse
    ports:
      - 55432:5432
    volumes:
      - ./psql_data/:/var/lib/postgresql/data

# ¿COmo ingresar al psql, añadiendo el puerto -p 55432?
# psql -h localhost -p 55432 -U Devs4 mateverse  