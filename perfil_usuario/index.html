<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>MateVerse | perfil</title>
        <link rel="icon" href="../imagenes/icono.ico">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link rel="stylesheet" href="../fronted/styles/styles.css">
        <link rel="stylesheet" href="../estilos/perfil.css">

        

    </head>


    <body>
        <div class="navbar">

            <img id="logo_pag" title="MateVerse" src="../imagenes/icono.ico" alt="Logo MateVerse">
            <div id="container_buscador">
                <label for="buscador" id="icono_lupa">🔍</label>
                <input id="buscador" type="text" placeholder="¿Qué meme buscas?">
            </div>
            <div id="contenedor_logos">
                <img class="logos" title="Inicio" src="../fronted/imagenes/inicio.png" alt="Logo Inicio">
                <img class="logos" title="Ranking" src="../fronted/imagenes/ranking.png" alt="Logo Ranking">
                <img class="logos" title="Logros" src="../fronted/imagenes/medallas.png" alt="Logo Medallas">
                <img class="logos" title="Perfil" src="../fronted/imagenes/perfil.png" alt="Logo Perfil">
                <img class="logos" title="Guardados" src="../fronted/imagenes/archivo.png" alt="Logo Archivo">
            </div>
        </div>
        <img class="logos" title="Postear" id="postear_meme" src="../fronted/imagenes/postear_meme.png" alt="Logo Posteo Meme">

        <div class="pagina_perfil">
            
        <figure class="foto_contenedor">
            <img class="foto_perfil is-rounded" src="../imagenes/perfil-default.jpeg">
            <span class="icono_editar">
                <i class="far fa-edit"></i>
            </span>
            <input type="file" id="inputFoto" accept="image/*" style="display:none;">
        </figure>

        <div class= "contenedor_campo_editable usuario_contenedor">
            <h2 class="nombre_usuario texto_editable" id="nombreUsuario">@Nombre_de_Usuario</h2>
            <input type="text" id="cambiar_mail" class="input_editar"  style="display:none";> 
    
        </div>
            
        </div>

        
    </body>

</html>
