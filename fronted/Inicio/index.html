<!DOCTYPE html>
<html lang="es">
    <head>
        <title>MateVerse</title>
        <link rel="icon" href="../imagenes/icono.ico">
        <link rel="stylesheet" href="../styles/styles.css">
    </head>
    <body>
        <div class="navbar">
            <img id="logo_pag" title="MateVerse" src="../imagenes/icono.ico" alt="Logo MateVerse">
            <div id="container_buscador">
                <label for="buscador" id="icono_lupa">🔍</label>
                <input id="buscador" type="text" placeholder="¿Qué meme buscas?">
            </div>
            <div id="contenedor_logos">
                <img class="logos" title="Inicio" src="../imagenes/inicio.png" alt="Logo Inicio">
                <img class="logos" title="Ranking" src="../imagenes/ranking.png" alt="Logo Ranking">
                <img class="logos" title="Logros" src="../imagenes/medallas.png" alt="Logo Medallas">
                <img class="logos" title="Perfil" src="../imagenes/perfil.png" alt="Logo Perfil">
                <img class="logos" title="Guardados" src="../imagenes/archivo.png" alt="Logo Archivo">
            </div>
        </div>
        <img class="logos" title="Postear" id="postear_meme" src="../imagenes/postear_meme.png" alt="Logo Posteo Meme">
    </body>
</html>
