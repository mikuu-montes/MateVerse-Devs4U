<!DOCTYPE html>
<html lang="en">
<head>
    <title>Subir memes</title>
    <link rel="icon" href="../imagenes/icono.ico">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
<div id="container">
    <div class="navbar">
    <img id="logo_pag" title="MateVerse" src="../imagenes/icono.ico" alt="Logo MateVerse">

    <div id="container_buscador">
    <label for="buscador" id="icono_lupa">🔍</label>
    <input id="buscador" type="text" placeholder="¿Qué meme buscas?">
</div>


    <div id="contenedor_logos">
        <img class="logos" src="../imagenes/inicio.png">
        <img class="logos" src="../imagenes/ranking.png">
        <img class="logos" src="../imagenes/perfil.png">
        <img class="logos" src="../imagenes/archivo.png">
    </div>
</div>
    <img id="logo_pag" title="MateVerse" src="../imagenes/icono.ico" alt="Logo MateVerse">
    <h2>PUBLICAR MEMES</h2>
    <form action="#" method="post">
        <input type="text" name="titulo" placeholder="Titulo" required>
        <input type="text" name="imagen" placeholder="Link de imagen/video" required>
        <input type="text" name="descripcion" placeholder="Descripcion" required>
        <input type="text" name="protagonista" placeholder="Protagonista" required>
        <input type="text" name="categoria" placeholder="Categoria" required>
        <input type="text" name="contexto" placeholder="Contexto" required>
        <label for="fechaCreacion">Fecha de creación del meme</label>
        <input type="date" name="fecha" required>
        <input type="text" name="Lugar_de_surgimiento" placeholder="Lugar de surgimiento" required>
        <button type="submit">Registrar</button>
    </form>

</div>
</body>
</html>
