<!DOCTYPE html>
<html lang="es">

    <head>
        
        <meta charset="UTF-8">

        <link rel="stylesheet" href="../styles/styles.css">
        <link rel="stylesheet" href="../styles/postearMeme.css">

    </head>

    <body>
        
        <div id="container">
            
            <div class="navbar">

                <a href="../Información/index.html" class="linkContainerInfo">
    
                    <img id="logoPag" title="MateVerse" src="../imagenes/icono.ico" alt="Logo MateVerse">
    
                </a>
    
    
                <div id="contenedorLogos">
    
                    <a href="../Inicio/index.html" class="linkContainerInicio">
    
                        <img class="logos" title="Inicio" src="../imagenes/inicio.png" alt="Logo Inicio">
    
                    </a>
    
                    <a href="../Ranking/index.html" class="linkContainerRanking">
    
                        <img class="logos" title="Ranking" src="../imagenes/ranking.png" alt="Logo Ranking">
    
                    </a>
    
                    <a href="../Perfil Usuario/index.html" class="linkContainerPerfil">
                        <img class="logos" title="Perfil" src="../imagenes/perfil.png" alt="Logo Perfil">
                    </a>
    
                    <a href="../Memes Guardados/index.html" class="linkContainerGuardados">
    
                        <img class="logos" title="Guardados" src="../imagenes/archivo.png" alt="Logo Archivo">
    
                    </a>
    
                </div>
    
            </div>
    
            <a href="../Post Meme/index.html" class="linkContainerPostear">
                
                <img class="logos" title="Postear" id="postearMeme" src="../imagenes/postear_meme.png" alt="Logo Posteo Meme">
    
            </a>

            <h2>PUBLICAR MEMES</h2>

            <form id="formCrearMeme" action="#" method="post">
    <input type="text" name="titulo" placeholder="Titulo" required>
    <input type="text" name="imagen_url" placeholder="Link de imagen del meme o de una que lo represente" required>
    <input type="url" name="video_url" placeholder="Si tu meme es un video, pone el link aca">
    <input type="text" name="descripcion" placeholder="Descripcion" required>
    <input type="text" name="protagonista" placeholder="Protagonista" required>

    <select id="input_categoria" name="id_categoria" required>
        <option value="" disabled selected>Selecciona una categoría</option>
    </select>
    <input type="hidden" name="contexto_id">

    <input type="text" name="lugar_surgimiento" placeholder="Lugar de surgimiento" required>
    <input type="text" name="medio_fuente" placeholder="Medio de fuente" required>
    <label for="fechaCreacion">Fecha de surgimiento del meme</label>
    <input type="date" name="fecha" required>

    <button type="submit">Registrar</button>
</form>


        </div>
    
        <script src="../js/postMeme.js"></script>
        <script src="../js/auth.js"></script>


    </body>

</html>
